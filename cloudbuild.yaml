steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/everly-app:$COMMIT_SHA', '.']
    id: 'Build-Image'

  # Step 2: Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/everly-app:$COMMIT_SHA']
    id: 'Push-Image'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'everly-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/everly-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'Deploy-to-Cloud-Run'

images:
  - 'gcr.io/$PROJECT_ID/everly-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
