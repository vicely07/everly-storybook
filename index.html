<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Everly - Memory Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                300: '#86efac',
                400: '#4ade80',
                500: '#22c55e',
                600: '#16a34a',
                700: '#15803d',
                800: '#166534',
                900: '#14532d',
                950: '#052e16',
              },
              orange: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
                950: '#172554',
              }
            },
            fontFamily: {
              sans: ['"Playfair Display"', 'serif'],
              serif: ['"Playfair Display"', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* --- GLOBAL ANIMATIONS --- */
      
      .animate-pulse-slow {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .8; transform: scale(0.95); }
      }

      .animate-spin-slow {
        animation: spin 8s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .animate-spin-reverse-slow {
        animation: spin-reverse 12s linear infinite;
      }
      @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      .animate-breathe {
        animation: breathe 4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.95); opacity: 0.6; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }

      /* New Natural Float Animations */
      .animate-float-slow {
        animation: float 15s ease-in-out infinite alternate;
      }
      .animate-float-slower-reverse {
        animation: float-reverse 20s ease-in-out infinite alternate;
      }
      @keyframes float {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, 40px); }
      }
      @keyframes float-reverse {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-40px, -40px); }
      }

      /* Glowing Effects */
      .text-glow {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 20px rgba(74, 222, 128, 0.4);
      }
      .glow-container {
        box-shadow: 0 0 50px rgba(74, 222, 128, 0.2);
      }

      /* Background Pulse for Intro */
      .animate-glow-pulse {
        animation: glow-pulse 6s ease-in-out infinite alternate;
      }
      @keyframes glow-pulse {
        0% { filter: brightness(1) saturate(1); opacity: 0.9; }
        100% { filter: brightness(1.3) saturate(1.2); opacity: 1; }
      }

      /* Glare Effect for Buttons */
      .animate-glare {
        animation: glare 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes glare {
        0% { transform: translateX(-100%) skewX(-15deg); }
        100% { transform: translateX(200%) skewX(-15deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
